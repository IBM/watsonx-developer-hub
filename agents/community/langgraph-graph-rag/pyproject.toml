[tool.poetry]
name = "langgraph-graph-rag"
version = "0.2.0"
description = "A template for a Graph RAG LangGraph app deployable on IBM Cloud as an ai_service."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "langgraph_graph_rag", from = "src" }
]


[tool.poetry.dependencies]
python = ">=3.11,<3.13"
ibm-watsonx-ai = "^1.5.0"
langgraph = "^1.2.11"
langchain-ibm = "^1.1.0"
langchain = "^1.4.0"
langchain_neo4j = "^0.4.0"
ibm_secrets_manager_sdk = "^2.1.9"
neo4j-graphrag = "^1.7.0"

[tool.poetry.group.dev.dependencies]
langchain-experimental = "^0.3.4"
langchain-text-splitters = "^0.3.11"
python-dotenv = "^1.0.1"
ibm-watsonx-ai-cli = ">=0.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
