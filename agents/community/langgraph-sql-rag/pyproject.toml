[tool.poetry]
name = "langgraph_sql_rag"
version = "0.2.0"
description = "A template for an Agentic SQL RAG LangGraph app deployable on IBM Cloud as an ai_service. This particular example focuses on a WatsonX chatbot enhanced with watsonx SQL DB Utility Tools."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "langgraph_sql_rag", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
langchain-ibm = "^1.1.1"
ibm-watsonx-ai = "^1.5.0"
langgraph = "^1.2.12"
langchain = "^1.4.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ibm-watsonx-ai-cli = ">=0.6.0"
pytest = "^9.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
